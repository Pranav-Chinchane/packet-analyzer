name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            flags: "-O2 -Wall -Wextra -Werror"
          - name: address-and-undefined
            flags: "-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all"
          - name: thread
            flags: "-O1 -g -fsanitize=thread"
    name: ${{ matrix.name }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Let ThreadSanitizer map memory
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          cmake --build build -j
      - name: Engine tests
        run: python3 tests/run_tests.py
      - name: Web server tests
        run: python3 tests/test_ui_server.py
